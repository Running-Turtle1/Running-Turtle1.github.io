name: Update GitHub Space Shooter

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Generate GitHub space shooter
        if: github.event_name != 'push' || hashFiles('images/gh-space-shooter.gif') == ''
        uses: czl9707/gh-space-shooter@v2
        with:
          github-token: ${{ secrets.GH_SPACE_SHOOTER_TOKEN || secrets.GITHUB_TOKEN }}
          username: Running-Turtle1
          output-path: images/gh-space-shooter.gif
          strategy: random
          fps: 25
          commit-message: Update GitHub space shooter

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
